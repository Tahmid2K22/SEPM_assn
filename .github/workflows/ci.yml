name: Spring Boot CI with PostgreSQL

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # This spins up Postgres so the Integration Tests can run
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sepm_test
          POSTGRES_USER: uni
          POSTGRES_PASSWORD: uni
        ports:
          - 5432:5432
        # Wait until postgres is ready before starting the job
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests
        env:
          # Datasource must be reachable during context startup
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sepm_test
          SPRING_DATASOURCE_USERNAME: uni
          SPRING_DATASOURCE_PASSWORD: uni
