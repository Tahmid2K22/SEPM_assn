services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: university
      POSTGRES_USER: uni
      POSTGRES_PASSWORD: uni
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uni -d university"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/university
      SPRING_DATASOURCE_USERNAME: uni
      SPRING_DATASOURCE_PASSWORD: uni
    ports:
      - "8080:8080"

volumes:
  pgdata:
